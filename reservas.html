
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUGA - Reservas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="sin-borde">

    <header>
        <div class="logo">
            <img src="img/logo_png.png" alt="Logo JUGA">
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="juegos.html">Juegos</a>
            <a href="carta.html">Carta</a>
            <a href="eventos.html">Eventos</a>
            <a href="reservas.html" class="pagina-activa">Reservas</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>

        <section class="portada-reservas">

            <div class="texto-portada-reservas">
                <h1>
                    RESERVÁ<br>
                    <span>TU MESA</span>
                </h1>

                <p>
                    Buena comida, juegos y la mejor compañía.<br>
                    Te esperamos en JUGA.
                </p>
            </div>

        </section>

        <section class="formulario-reservas">

            <h2>HACÉ TU RESERVA</h2>
            <p>Completá con tus datos y asegurá tu mesa.</p>

            <form>

                <div class="campos-reserva">

                    <div class="campo-reserva">
                        <label for="fecha">FECHA</label>
                        <input type="date" id="fecha" required>
                    </div>

                    <div class="campo-reserva">
                        <label for="nombre">NOMBRE</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="campo-reserva">
                        <label for="hora">HORA</label>
                        <select id="hora" required>
                            <option value="">Seleccioná una hora</option>
                            <option>19:00 hs</option>
                            <option>20:00 hs</option>
                            <option>21:00 hs</option>
                            <option>22:00 hs</option>
                        </select>
                    </div>

                    <div class="campo-reserva">
                        <label for="telefono">TELÉFONO</label>
                        <input type="tel" id="telefono" placeholder="Tu teléfono" required>
                    </div>

                    <div class="campo-reserva">
                        <label for="personas">CANTIDAD DE PERSONAS</label>
                        <select id="personas" required>
                            <option value="">Seleccioná</option>
                            <option>1 persona</option>
                            <option>2 personas</option>
                            <option>3 personas</option>
                            <option>4 personas</option>
                            <option>5 personas</option>
                            <option>6 personas</option>
                        </select>
                    </div>

                    <div class="campo-reserva">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" placeholder="Tu email" required>
                    </div>

                </div>

                <button type="submit" class="boton-reservar">
                    RESERVAR MESA →
                </button>

            </form>

        </section>

    </main>

</body>
</html>
